# CI cho mọi PR và main (06 §6.11.2, VS00-T09).
# format → analyze → lint → test domain + contract → test server (PostgreSQL 16)
# → test mobile (unit, widget, golden trên Linux ED-09, câu chữ) → báo cáo AC (ED-02).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          # Cần lịch sử để biết PR có đổi file thư viện không (VS21-T09).
          fetch-depth: 0

      # PostgreSQL 16 cho test: database tạm, chỉ mở trên localhost của máy chạy
      # CI, không dùng mật khẩu nên repo và GitHub không chứa giá trị nào. Không
      # xác thực SCRAM cũng giữ test 10 kết nối đồng thời (TAC-05) trong giới hạn
      # thời gian.
      - name: PostgreSQL 16
        run: |
          docker run -d --name test-db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          for _ in $(seq 1 60); do
            docker exec test-db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec test-db pg_isready -h 127.0.0.1 -U postgres
          echo "TEST_DATABASE_URL=postgres://postgres@localhost:5432/postgres" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          # Phiên bản ghim ở environment.flutter của app.
          flutter-version-file: apps/mobile/pubspec.yaml
          channel: stable
          cache: true

      # Drift dùng SQLite của hệ điều hành khi chạy test (NativeDatabase).
      - name: Cài libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: tool/check.sh
        run: tool/check.sh

      - name: PR đổi schema.sql phải kèm migration mới (06 Bản 3 VS32-T01, IR3-05)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD | grep -qx apps/server/db/schema.sql \
            && ! git diff --name-only --diff-filter=A "$BASE" HEAD | grep -q '^apps/server/migrations/[0-9]\{4\}_.*\.sql$'; then
            echo "apps/server/db/schema.sql đổi nhưng không có file migration mới" >&2
            exit 1
          fi
          if git diff --name-only --diff-filter=MD "$BASE" HEAD | grep -q '^apps/server/migrations/[0-9]\{4\}_.*\.sql$'; then
            echo "Migration đã có không được sửa hay xóa (chỉ thêm file mới)" >&2
            exit 1
          fi

      - name: compat_e2e — app 2.x với server Bản 3 khi PR đụng đồng bộ, contract, cấu trúc (06 Bản 3 §6.11.1)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qE '^(apps/server/lib/src/(sync|account|auth)/|apps/server/migrations/|packages/api_contract/|tool/compat)'; then
            tool/compat_e2e.sh
          fi

      - name: Cổng thư viện khi PR đổi data/v3__exercises.json (06 Bản 3 VS33-T10)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qx data/v3__exercises.json; then
            tool/library_check.sh
          fi

      - name: Báo cáo AC → test (ED-02)
        if: always()
        run: dart run tool/ac_report.dart >> "$GITHUB_STEP_SUMMARY"

      - name: Lưu ảnh golden lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/mobile/test/**/failures/
          if-no-files-found: ignore
