version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  api_contract:
    path: ../../packages/api_contract
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  domain:
    path: ../../packages/domain
  drift: ">=2.28.0 <2.29.0"
