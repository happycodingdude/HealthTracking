name: mobile
description: App iPhone Health Tracking (Flutter).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  api_contract:
    path: ../../packages/api_contract
  # 7.3.2 kéo nm 0.6 → dbus 0.8, xung đột với flutter_local_notifications 20
  # (gói Linux cần dbus 0.7). App chỉ chạy iOS; bỏ ghim khi hai bên cùng dbus.
  connectivity_plus: ">=7.3.0 <7.3.2"
  dio: ^5.11.1
  domain:
    path: ../../packages/domain
  drift: ">=2.28.0 <2.29.0"
  drift_flutter: ^0.2.4
  # 1.1.0 cần vector_math 2.2 (translateByDouble), Flutter 3.32 ghim 2.1.4.
  fl_chart: 1.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  flutter_timezone: ^5.1.1
  go_router: ^17.0.0
  sentry_flutter: ^9.30.1
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ">=2.28.0 <2.29.0"
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Server test thật cho test E2E đồng bộ (sync_e2e, 06 §6.9.1).
  postgres: ^3.5.7
  server:
    path: ../server
  shelf: ^1.4.2
  yaml: ^3.1.4

flutter:
  uses-material-design: true
