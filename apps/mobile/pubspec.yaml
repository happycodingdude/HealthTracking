name: mobile
description: App iPhone Ironly (Flutter).
publish_to: none
# App gửi phiên bản này trong header X-App-Version (05 Bản 2 TR2-13); Bản 4 = 4.0.0 (05 Bản 4 TD4-11).
version: 4.0.0+1
resolution: workspace

environment:
  sdk: ^3.8.0
  # Phiên bản Flutter của dự án (tool/flutter_sdk.sh, CI flutter-version-file).
  flutter: 3.47.6

dependencies:
  api_contract:
    path: ../../packages/api_contract
  # 7.3.2 kéo nm 0.6 → dbus 0.8, xung đột với flutter_local_notifications 20
  # (gói Linux cần dbus 0.7). App chỉ chạy iOS; bỏ ghim khi hai bên cùng dbus.
  connectivity_plus: ">=7.3.0 <7.3.2"
  dio: ^5.11.1
  domain:
    path: ../../packages/domain
  drift: ">=2.28.0 <2.29.0"
  drift_flutter: ^0.2.4
  # 1.1.0 cần vector_math 2.2 (translateByDouble), Flutter 3.32 ghim 2.1.4.
  fl_chart: 1.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.3.4
  # Sơ đồ cơ 16 vùng (05 Bản 2 TD2-14).
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^17.0.0
  # Phiên bản app cho header X-App-Version (06 Bản 2 ED2-02).
  package_info_plus: ^10.2.1
  # Xóa file SQLite và thư mục dish_images khi đăng xuất (05 Bản 3 TD3-17).
  path_provider: ^2.1.6
  sentry_flutter: ^9.30.1
  # Cờ logout_pending trong UserDefaults (05 Bản 3 TD3-17).
  shared_preferences: ^2.5.6
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  # Chặn WebView của trình phát chỉ tải miền YouTube (05 Bản 2 §6.4.6, §6.13).
  webview_flutter: ^4.14.1
  # Phát video YouTube ngắn trong app, chỉ tạo khi Bạn chạm phát (TD2-19).
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ">=2.28.0 <2.29.0"
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Server test thật cho test E2E đồng bộ (sync_e2e, 06 §6.9.1).
  postgres: ^3.5.7
  server:
    path: ../server
  shelf: ^1.4.3
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  assets:
    # 4 file SVG sơ đồ cơ Bạn đã duyệt, nguyên văn (06 Bản 2 IR2-08).
    - assets/body_map/
  config:
    # Thư viện iOS quản lý bằng CocoaPods như trước. Swift Package Manager tải
    # gói nhị phân của Sentry phải chờ quyền Keychain, làm treo build tự động.
    enable-swift-package-manager: false
